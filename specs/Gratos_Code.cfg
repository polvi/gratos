SPECIFICATION Spec
\* Quiescence is legal: once every ticket id is used and every user is
\* created or deleted, nothing may be enabled. That is the finite id pool
\* running dry, not a stuck protocol.
CHECK_DEADLOCK FALSE
\* Design toggles (all TRUE = the design as built). Flipping each one to FALSE
\* reproduces the attack it guards against:
\*   BindVerifier = FALSE     -> OtpBoundToStarter fails (attacker redeems a
\*                               victim's ticket with a leaked code)
\*   VerifyChecksUser = FALSE -> SessionsForLiveUsers fails (code minted, user
\*                               deleted, code redeemed)
\*   CapAddAmr = FALSE        -> AddNeverExceedsParent / ChainBound fail (otp
\*                               session adds a passkey, gets a webauthn session)
\* ProvenanceBound and LeakedCodeYieldsOnlyOtp are deliberately absent: they
\* fail by design (see the module header).
CONSTANTS
    Browsers = {b1, atk}
    Attacker = atk
    Users = {u1, u2}
    Tickets = {t1, t2}
    Codes = {k1, k2}
    Kinds = {"webauthn", "softkey"}
    MaxMints = 2
    MaxTries = 2
    MaxCreds = 2
    BindVerifier = TRUE
    VerifyChecksUser = TRUE
    CapAddAmr = TRUE
INVARIANTS
    TypeOK
    OneSessionPerTicket
    OtpBoundToStarter
    AttackerOnlyRedeemsOwnTickets
    TriesBounded
    MintsBounded
    GuessBudget
    SessionsForLiveUsers
    CodesForLiveUsers
    NoCodeBeforeStart
    AddNeverExceedsParent
    ChainBound
