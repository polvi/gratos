SPECIFICATION Spec
\* Quiescence is legal: every mission and pending record can reach a terminal
\* state (closed / gone), after which no action is enabled for it; with the
\* finite id pools fully terminal, the system rests. Java TLC needs the
\* equivalent -deadlock flag without this line.
CHECK_DEADLOCK FALSE
CONSTANTS
    Users = {u1, u2}
    MissionIds = {m1, m2}
    PendingIds = {p1, p2}
    Resources = {r1, r2}
    MaxAmt = 1
    NoUser = NoUser
INVARIANTS
    TypeOK
    CodeSingleUse
    ApproverBinding
    AttenuationNeverWidens
    NoIssuanceAfterClose
    OneShotPickup
PROPERTIES
    ClosedIsTerminal
    GoneIsTerminal
